name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build
        run: go build ./...

      - name: Validate paper metadata
        run: go run ./cmd/iswiki validate

      - name: README table is up to date
        run: |
          go run ./cmd/iswiki readme
          git diff --exit-code README.md || {
            echo "::error::README table is stale — run 'go run ./cmd/iswiki readme' and commit the result"
            exit 1
          }

      - name: Wiki index is up to date
        run: |
          go run ./cmd/iswiki toc
          git diff --exit-code wiki/index.md || {
            echo "::error::wiki/index.md is stale — run 'go run ./cmd/iswiki toc' and commit the result"
            exit 1
          }

      - name: Institutions index is up to date
        run: |
          go run ./cmd/iswiki orgs
          git diff --exit-code wiki/institutions.md || {
            echo "::error::wiki/institutions.md is stale — run 'go run ./cmd/iswiki orgs' and commit the result"
            exit 1
          }
